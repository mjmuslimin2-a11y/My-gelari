name: Build MyVault APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          FILE=$(find . -type f -name 'settings.gradle.kts' \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$FILE" ]; then
            FILE=$(find . -type f -name 'settings.gradle' \
              -not -path '*/.gradle/*' | head -n 1)
          fi

          if [ -z "$FILE" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          ROOT=$(dirname "$FILE")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project found at: $ROOT"

      - name: Build Debug APK
        run: gradle -p "${{ steps.project.outputs.root }}" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
