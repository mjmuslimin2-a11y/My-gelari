name: Build MyVault APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          ROOT=""

          while IFS= read -r file; do
            ROOT="$(dirname "$file")"
            break
          done < <(find . -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) -not -path "*/.gradle/*")

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project found at: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle -p "${{ steps.project.outputs.root }}" \
            assembleDebug \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
